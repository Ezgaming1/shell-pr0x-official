<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Launcher</title>
  <!-- Load Ultraviolet Bundle & Config -->
  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
</head>
<body>
  <h1>Static UV Launcher</h1>
  <form id="uv-form">
    <input type="text" id="uv-address" placeholder="Enter URL or search term..." style="width: 300px; padding: 8px;">
    <button type="submit">Go</button>
  </form>

  <iframe id="uv-frame" style="width: 100%; height: 600px; border: none; margin-top: 20px;"></iframe>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./uv/uv.sw.js', {
        scope: __uv$config.prefix
      }).catch(err => console.error('Service Worker registration failed:', err));
    }

    // Handle Form Search / URL Input
    const form = document.getElementById('uv-form');
    const address = document.getElementById('uv-address');
    const frame = document.getElementById('uv-frame');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let url = address.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
      }
      
      // Encode URL using XOR
      frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
    });
  </script>
</body>
</html>
